name: Smart Contract CI

on:
  push:
    paths:
      - 'contracts/**'
      - '.github/workflows/smart-contract-ci.yml'
  pull_request:
    paths:
      - 'contracts/**'
      - '.github/workflows/smart-contract-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-lint-and-test:
    name: Lint & Test Soroban Contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: rustfmt

      - name: Cache Cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            contracts/target
          key: ${{ runner.os }}-cargo-contracts-${{ hashFiles('contracts/Cargo.lock') }}

      - name: Verify Code Formatting
        run: cargo fmt --all --check

      - name: Run Workspace Tests
        run: cargo test --workspace --locked

      - name: Compile Soroban WASM Binaries
        run: cargo build --workspace --target wasm32v1-none --release --locked

      - name: Upload Smart Contract Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: soroban-wasm-contracts
          path: contracts/target/wasm32v1-none/release/*.wasm
          if-no-files-found: error
          retention-days: 14
